<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14181c" />
      <stop offset="100%" stop-color="#202830" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e054" />
      <stop offset="100%" stop-color="#00b03e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc / Card -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)" stroke="#2c3440" stroke-width="3" />
  
  <!-- Letterboxd Circles (Green, Orange, Blue) -->
  <circle cx="44" cy="46" r="14" fill="#00e054" opacity="0.9" />
  <circle cx="64" cy="46" r="14" fill="#ff8000" opacity="0.9" />
  <circle cx="84" cy="46" r="14" fill="#40bcf4" opacity="0.9" />

  <!-- AI Sparkle / Magic Wand / Brain lines -->
  <path d="M64 70 L67 82 L79 85 L67 88 L64 100 L61 88 L49 85 L61 82 Z" fill="#ffffff" filter="url(#glow)" />
  <circle cx="38" cy="80" r="3.5" fill="#00e054" />
  <circle cx="90" cy="80" r="3.5" fill="#40bcf4" />
  <circle cx="64" cy="22" r="2.5" fill="#ff8000" />
</svg>