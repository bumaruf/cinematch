name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The film catalog comes from IMDb's non-commercial datasets and is not
      # versioned. An empty stub is enough to typecheck, test and build; the
      # tests that need real films are skipped.
      - run: npm run catalog:stub
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
